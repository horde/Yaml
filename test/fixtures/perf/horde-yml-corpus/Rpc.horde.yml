---
id: Rpc
name: Rpc
full: RPC library
description: A library providing various remote methods of accessing Horde functionality.
list: dev
type: horde-library
homepage: https://www.horde.org/libraries/Horde_Rpc
authors:
  -
    name: Jan Schneider
    user: jan
    email: jan@horde.org
    active: true
    role: lead
  -
    name: Michael J Rubinsky
    user: mrubinsk
    email: mrubinsk@horde.org
    active: true
    role: developer
  -
    name: Chuck Hagenbuch
    user: chuck
    email: chuck@horde.org
    active: false
    role: lead
version:
  release: 3.0.0-beta4
  api: 3.0.0alpha1
state:
  release: beta
  api: alpha
license:
  identifier: LGPL-2.1-only
  uri: http://www.horde.org/licenses/lgpl21
dependencies:
  required:
    php: ^8.2
    composer:
      horde/exception: ^3
      horde/perms: ^3
      horde/serialize: ^3
      horde/support: ^3
      horde/translation: ^3
      horde/util: ^3
      horde/xml_element: ^3
      psr/http-message: ^1.1 || ^2.0
      psr/http-server-handler: ^1.0
      psr/http-server-middleware: ^1.0
      psr/http-factory: ^1.0
      psr/http-client: ^1.0
      psr/event-dispatcher: ^1.0
  optional:
    composer:
      horde/core: ^3
      horde/dav: ^2
      horde/http: ^3
      horde/activesync: ^3
      horde/eventdispatcher: ^3
      horde/lock: ^3
      horde/syncml: ^3
    ext:
      soap: '*'
      xmlrpc: '*'
  dev:
    composer:
      horde/activesync: ^3
      horde/http: ^3
keywords:
  - soap
  - jsonrpc
  - json-rpc
  - psr-15
  - activesync
autoload:
  psr-0:
    Horde_Rpc: lib/
  psr-4:
    Horde\Rpc\: src/
vendor: horde
quality:
  phpstan:
    level: 3
