id: Identity
name: Identity
type: library
full: Short headline for Identity
description: >-
  Foundation classes and interfaces for treating identities as first class
  citizens at the centre of resource ownership, authentication and
  authorization. Identity has roots in the concept of paypal principals and in
  decoupling login users from persona. Identity is *not* the same as
  Horde_Prefs_Identity which is more like an email profile but takes over some
  of its concepts.
