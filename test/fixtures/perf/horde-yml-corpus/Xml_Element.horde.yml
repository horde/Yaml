---
id: Xml_Element
name: Xml_Element
full: XML element library
description: >-
  A library that provides an element object that can be used to provide
  SimpleXML-like functionality over a DOM object. The main advantage over using
  SimpleXML is the ability to add multiple levels of new elements in a single
  call, without introducing "ghost" objects.
list: dev
type: library
homepage: https://www.horde.org/libraries/Horde_Xml_Element
authors:
  -
    name: Chuck Hagenbuch
    user: chuck
    email: chuck@horde.org
    active: false
    role: lead
version:
  release: 3.0.0-beta2
  api: 3.0.0alpha1
state:
  release: beta
  api: alpha
license:
  identifier: BSD-2-Clause
  uri: http://www.horde.org/licenses/bsd
dependencies:
  required:
    php: ^8.1
    composer:
      horde/exception: ^3
      horde/util: ^3
    ext:
      dom: '*'
  optional:
    composer:
      horde/test: ^3
autoload:
  psr-0:
    Horde_Xml: lib/
  psr-4:
    Horde\Xml\Element\: src/
quality:
  phpstan:
    level: 9
vendor: horde
keywords:
  - dom
